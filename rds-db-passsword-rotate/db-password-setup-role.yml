Description: IAM role and shared resources for DB2 password rotation Lambda functions
Parameters:
  LayerS3Bucket:
    Type: String
    Description: S3 bucket containing the ibm_db_layer.zip file
    Default: sbg-devops-tools-bucket
  LayerS3Key:
    Type: String
    Description: S3 key (path) to the ibm_db_layer.zip file
    Default: db2passwordrotate/ibm_db_layer.zip
Resources:
  IbmDbLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: ibm_db_layer
      Description: IBM DB2 driver layer for Python 3.11
      Content:
        S3Bucket: !Ref LayerS3Bucket
        S3Key: !Ref LayerS3Key
      CompatibleRuntimes:
        - python3.11

  Db2AdminServiceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: devops/db2-rotate/admin-credentials
      Description: Admin service user credentials for DB2 password rotation (used to connect and change other users' passwords)
      SecretString: '{"username":"ssbgpsswd","password":"CHANGE_ME_AFTER_DEPLOY"}'

  Db2PasswordRotateFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/BoundedPermissionsPolicy
      RoleName: "Bounded-Db2PasswordRotateFunctionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: "Bounded-Db2PasswordRotateFunctionPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:GetRandomPassword
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecretVersionStage
                  - secretsmanager:DescribeSecret
                  - secretsmanager:UpdateSecret
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AttachNetworkInterface
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - "arn:aws:s3:::sbg-devops-tools-bucket"
                  - "arn:aws:s3:::sbg-devops-tools-bucket/*"

Outputs:
  IbmDbLayerArn:
    Description: ARN of the ibm_db Lambda layer (use in team rotation stacks)
    Value: !Ref IbmDbLayer
    Export:
      Name: IbmDbLayerArn
