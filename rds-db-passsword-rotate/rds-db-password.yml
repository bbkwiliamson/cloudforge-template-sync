AWSTemplateFormatVersion: '2010-09-09'

Description: (RdsPasswordRotateFunction) CloudFormation template for rotating Secrets Manager credentials and updating PostgreSQL user in RDS


Parameters:
  
  SecretName:
    Type: String
    Description: Name of the Secrets Manager secret containing the RDS credentials
  
  DatabaseIdentifier:
    Type: String
    Description: Identifier of the RDS instance or cluster
  
  EnvironmentName:
    Description: Environment where the Lambda Function is deployed
    Type: String
    AllowedValues:
      - prod
      - sit
      - poc
      - dev
  
  GroupName:
    Type: String
    Description: Name of the group that will be assigned to the Lambda function
  
  LambdaName:
    Type: String
    Default: 'RotateCredentialsFunction'
    Description: RDS Password Rotate Function name
  
  RotationSchedule:
    Type: String
    Default: 'rate(365 days)'
    Description: Schedule for password rotation
    AllowedValues:
      - 'rate(14 days)'
      - 'rate(30 days)'
      - 'rate(60 days)'
      - 'rate(120 days)'
      - 'rate(365 days)'
  
  NotificationEmail:
    Type: String
    Description: Email address for password rotation failure notifications
    
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bounded-${GroupName}-${LambdaName}-ExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/BoundedPermissionsPolicy'
      Policies:
        - PolicyName: !Sub 'bounded-${LambdaName}-LambdaExecutionPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LambdaLogGroup.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref PasswordRotationTopic
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecretVersionStage
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetRandomPassword
                  - secretsmanager:UpdateSecret
                Resource: '*'
              - Effect: Allow
                Action:
                  - rds:ModifyDBInstance
                  - rds:ModifyDBCluster
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                Resource: '*'

  PasswordRotationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${LambdaName}-PasswordRotationFailures'
      DisplayName: 'RDS Password Rotation Failures'
      Tags:
        - Key: Team
          Value: !Ref GroupName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: HoursOfOperation
          Value: sbg_custom
        - Key: Tier
          Value: MCA
        - Key: TeamEmail
          Value: !Ref NotificationEmail

  PasswordRotationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref PasswordRotationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${GroupName}/${LambdaName}'
      RetentionInDays: 14

  RotateCredentialsFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      FunctionName: !Sub '${EnvironmentName}-${GroupName}-RdsPasswordRotateFunction'
      Description: 'Rotate RDS credentials and update PostgreSQL user in RDS'
      Runtime: python3.9
      Tags:
        - Key: Team
          Value: !Ref GroupName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: HoursOfOperation
          Value: sbg_custom
        - Key: Tier
          Value: MCA
        - Key: TeamEmail
          Value: !Ref NotificationEmail
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import os
          import boto3
          import json
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          sns_client = boto3.client('sns')
          topic_arn = os.environ('SNS_TOPIC_ARN')
          AccountID = sts.get_caller_identity()

          def send_failure_notification(message):
              
              if topic_arn:
                  sns_client.publish(
                      TopicArn=topic_arn,
                      Subject='RDS Password Rotation Failed',
                      Message=message
                  )

          def get_secret(secret_name):
              client = boto3.client('secretsmanager')
              response = client.get_secret_value(SecretId=secret_name)
              secret = json.loads(response['SecretString'])
              return secret['password'], secret['username']

          def update_database_user(password, db_identifier):
              rds_client = boto3.client('rds')
              rds_client.modify_db_instance(
                    DBInstanceIdentifier=db_identifier,
                    MasterUserPassword=password,
                    ApplyImmediately=True
                )

          def update_secret(secret_name, new_password, username):
              secret_client = boto3.client('secretsmanager')
              secret_client.update_secret(SecretId=secret_name, SecretString=json.dumps({
                  'password': new_password,
                  'username': username
              }))

          def lambda_handler(event, context):
              try:          
                  # Get the new password from AWS Secrets Manager
                  secret_client = boto3.client('secretsmanager')
                  response = secret_client.get_random_password(ExcludeNumbers=True, ExcludePunctuation=True)
                  new_password = response['RandomPassword']
                  # Update the database user with the new password
                  db_identifier = os.environ['DatabaseIdentifier']
                  try:
                      update_database_user(new_password, db_identifier)
                  except Exception as db_error:
                      error_msg = f"Failed to update database password for {db_identifier}: {str(db_error)}"
                      logger.error(error_msg)
                      send_failure_notification(error_msg)
                      raise
                  # Update the secret in AWS Secrets Manager with the new password
                  secret_name = os.environ['SecretName']
                  old_password, username = get_secret(secret_name)
                  try:
                      update_secret(secret_name, new_password, username)
                  except Exception as secret_error:
                      error_msg = f"Failed to update secret {secret_name}: {str(secret_error)}"
                      logger.error(error_msg)
                      send_failure_notification(error_msg)
                      raise
                  logger.info("Credentials rotation successful.")
                  return {
                      'statusCode': 200,
                      'body': json.dumps('Credentials rotation successful.')
                  }
              except Exception as e:
                  logger.error(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps('Error rotating credentials.')
                  }

      Environment:
        Variables:
          SecretName: !Ref SecretName
          DatabaseIdentifier: !Ref DatabaseIdentifier
          SNS_TOPIC_ARN: !Ref PasswordRotationTopic

  PasswordRotationSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: 'Trigger RDS password rotation based on selected schedule'
      ScheduleExpression: !Ref RotationSchedule
      State: ENABLED
      Targets:
        - Arn: !GetAtt RotateCredentialsFunction.Arn
          Id: 'RotateCredentialsFunctionTarget'

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RotateCredentialsFunction
      Action: 'lambda:InvokeFunction'
      Principal: 'events.amazonaws.com'
      SourceArn: !GetAtt PasswordRotationSchedule.Arn
