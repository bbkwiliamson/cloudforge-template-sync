AWSTemplateFormatVersion: "2010-09-09"

Description: FIS experiment template for ECS network disruption by AZ.

# ─── Subnet quick-reference ───────────────────────────────────────────────────
#
# DEV (735721437522) — af-south-1
#   Tier              | Subnet ID                  | AZ           | Clusters
#   dev-private-1a    | subnet-04e4f5129ba10b472   | af-south-1a  | dps-standalone-cdk
#   dev-private-1b    | subnet-0e6e4479fa3311656   | af-south-1b  | dps-standalone-cdk
#   ingress-1a        | subnet-0cc933f4b706a417c   | af-south-1a  | sbg-mobile-dev
#   ingress-1b        | subnet-08f250efc1f721928   | af-south-1b  | sbg-mobile-dev
#   tools-1a          | subnet-083c1366ab8510c5d   | af-south-1a  | bcoe-standalone-cdk
#   tools-1b          | subnet-010c4b53347308eb9   | af-south-1b  | bcoe-standalone-cdk
#
# SIT (183723809405) — af-south-1
#   Tier              | Subnet IDs                                                  | AZ           | Clusters Affected
#   app-ext-1a        | subnet-0abb22d4ca52e017c, subnet-01f5c24c28eb880fe          | af-south-1a  | dps, dcp, dee, comms, sbgsecurity(config), customerplatform
#   app-ext-1b        | subnet-03a064512d7946fb8, subnet-0b85e2d44d1aad081          | af-south-1b  | dps, dcp, dee, comms, sbgsecurity(config), customerplatform
#   ext-only-1a       | subnet-01f5c24c28eb880fe                                    | af-south-1a  | aims
#   ext-only-1b       | subnet-0b85e2d44d1aad081                                    | af-south-1b  | aims
#   tools-1a          | subnet-0a6e79705a161185b                                    | af-south-1a  | sbgsecurity, bcoe, sbg-bcoe, web-coe, comms-prometheus, customerplatform(hazelcast)
#   tools-1b          | subnet-0f3eba7e6758653b4                                    | af-south-1b  | sbgsecurity, bcoe, sbg-bcoe, web-coe, comms-prometheus, customerplatform(hazelcast)
#   ingress-1a        | subnet-0817210c1fcb3023c                                    | af-south-1a  | sbg-mobile (mesh-gateway ALB)
#   ingress-1b        | subnet-0f19d4ecc39baf403                                    | af-south-1b  | sbg-mobile (mesh-gateway ALB)
#
# ─── Deploy ───────────────────────────────────────────────────────────────────
#
#   aws cloudformation deploy \
#     --template-file fis-ecs-experiment-template.yaml \
#     --stack-name <env>-FIS-ECS-DR \
#     --parameter-overrides \
#         Application=sbg-<env>-dr \
#         Environment=<dev|sit|prod> \
#         GroupEmail=<team-email> \
#         VPC=vpc-<env>-customer-mobile-platform \
#         FISRoleArn=arn:aws:iam::<account>:role/<role-name> \
#         SubnetArnsToDisrupt=arn:aws:ec2:af-south-1:<account>:subnet/<id> \
#         TCKey=<tc> UTRKey=<utr> \
#     --region af-south-1
#
# ──────────────────────────────────────────────────────────────────────────────

Parameters:

  Application:
    Type: String
    Description: Application name used in resource naming and billing tags (e.g. sbg-dev-dr, sbg-sit-dr)

  Environment:
    Type: String
    AllowedValues:
      - dev
      - sit
      - prod
    Description: Target environment

  GroupEmail:
    Type: String
    Description: Email address to receive FIS experiment status notifications

  VPC:
    Type: String
    Description: >
      Short VPC label used in resource naming — not the VPC ID.
      (e.g. vpc-dev-customer-mobile-platform, vpc-sit-customer-mobile-platform)

  SubnetArnsToDisrupt:
    Type: CommaDelimitedList
    Description: >
      Comma-separated subnet ARNs to disrupt.
      Format: arn:aws:ec2:<region>:<account-id>:subnet/<subnet-id>
      Use the subnet quick-reference comment at the top of this template.

  Scope:
    Type: String
    AllowedValues:
      - all
      - availability-zone
      - dynamodb
      - prefix-list
      - s3
      - vpc
    Default: availability-zone
    Description: >
      Scope of the network disruption. Use availability-zone to simulate a full AZ
      failure scoped to the selected subnets.

  Duration:
    Type: String
    Default: PT5M
    Description: ISO 8601 duration (e.g. PT5M = 5 minutes, PT20M = 20 minutes)

  AccountTargeting:
    Type: String
    AllowedValues:
      - multi-account
      - single-account
    Default: single-account

  EmptyTargetResolution:
    Type: String
    AllowedValues:
      - fail
      - skip
    Default: fail

  LogRetentionInDays:
    Type: Number
    Default: 7
    AllowedValues:
      - 1
      - 3
      - 7
      - 14
      - 30
      - 60
      - 90

  # Tags
  TCKey:
    Type: String
    Description: Tag

  UTRKey:
    Type: String
    Description: Tag

Resources:

  # ── IAM ─────────────────────────────────────────────────────────────────────

  NetworkFISExperimentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-FISNetworkDisruptRole"
      Description: Role assumed by AWS FIS to run network disruption experiments.
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/BoundedPermissionsPolicy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: fis.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FISNetworkDisruptPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateTagsOnNetworkAcl
                Effect: Allow
                Action: ec2:CreateTags
                Resource: "arn:aws:ec2:*:*:network-acl/*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: CreateNetworkAcl
                    aws:RequestTag/managedByFIS: "true"
              - Sid: CreateNetworkAclOnVpc
                Effect: Allow
                Action: ec2:CreateNetworkAcl
                Resource: "arn:aws:ec2:*:*:vpc/*"
              - Sid: CreateNetworkAcl
                Effect: Allow
                Action: ec2:CreateNetworkAcl
                Resource: "arn:aws:ec2:*:*:network-acl/*"
                Condition:
                  StringEquals:
                    aws:RequestTag/managedByFIS: "true"
              - Sid: ManageNetworkAcl
                Effect: Allow
                Action:
                  - ec2:CreateNetworkAclEntry
                  - ec2:DeleteNetworkAcl
                Resource:
                  - "arn:aws:ec2:*:*:network-acl/*"
                  - "arn:aws:ec2:*:*:vpc/*"
                Condition:
                  StringEquals:
                    ec2:ResourceTag/managedByFIS: "true"
              - Sid: VpcDescribeActions
                Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeManagedPrefixLists
                  - ec2:DescribeSubnets
                  - ec2:DescribeNetworkAcls
                Resource: "*"
              - Sid: ReplaceNetworkAclAssociation
                Effect: Allow
                Action: ec2:ReplaceNetworkAclAssociation
                Resource:
                  - "arn:aws:ec2:*:*:subnet/*"
                  - "arn:aws:ec2:*:*:network-acl/*"
              - Sid: CloudWatchLogsForFIS
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:log-group:*:log-stream:*"
              - Sid: S3LogDelivery
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - s3:GetBucketAcl
                  - s3:PutObject
                Resource: "arn:aws:s3:::*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-FISNetworkDisruptRole"
        - Key: Application
          Value: !Ref Application
        - Key: Environment
          Value: !Ref Environment
        - Key: CreatedBy
          Value: CloudForge
        - Key: TCKey
          Value: !Ref TCKey
        - Key: UTRKey
          Value: !Ref UTRKey

  # ── FIS ─────────────────────────────────────────────────────────────────────

  DisruptAvailabilityZoneExperiment:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: !Sub "${VPC}-network-disrupt"
      LogConfiguration:
        CloudWatchLogsConfiguration:
          LogGroupArn: !GetAtt CloudwatchLogGroup.Arn
        LogSchemaVersion: 2
      Targets:
        Subnets-Target-1:
          ResourceType: aws:ec2:subnet
          ResourceArns: !Ref SubnetArnsToDisrupt
          SelectionMode: ALL
      Actions:
        disruptAz:
          ActionId: aws:network:disrupt-connectivity
          Parameters:
            duration: !Ref Duration
            scope: !Ref Scope
          Targets:
            Subnets: Subnets-Target-1
      StopConditions:
        - Source: none
      RoleArn: !GetAtt NetworkFISExperimentRole.Arn
      ExperimentOptions:
        AccountTargeting: !Ref AccountTargeting
        EmptyTargetResolutionMode: !Ref EmptyTargetResolution
      Tags:
        Name: !Ref AWS::StackName
        Application: !Ref Application
        BillingApplicationName: !Ref Application
        Environment: !Ref Environment
        CreatedBy: CloudForge
        TCKey: !Ref TCKey
        UTRKey: !Ref UTRKey

  # ── Observability ────────────────────────────────────────────────────────────

  CloudwatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/fis/${AWS::StackName}/DR-DisruptSubnetTest"
      RetentionInDays: !Ref LogRetentionInDays
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: BillingApplicationName
          Value: !Ref Application
        - Key: Application
          Value: !Ref Application
        - Key: Environment
          Value: !Ref Environment
        - Key: TCKey
          Value: !Ref TCKey
        - Key: UTRKey
          Value: !Ref UTRKey
        - Key: Creator
          Value: CloudForge

  MonitoringSnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: "alias/aws/sns"
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: BillingApplicationName
          Value: !Ref Application
        - Key: Application
          Value: !Ref Application
        - Key: Environment
          Value: !Ref Environment
        - Key: TCKey
          Value: !Ref TCKey
        - Key: UTRKey
          Value: !Ref UTRKey
        - Key: Creator
          Value: CloudForge

  EventTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Statement:
          - Sid: EventsPermission
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: "*"
          - Sid: CloudwatchPermission
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: "*"
      Topics:
        - !Ref MonitoringSnsTopic

  SNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref GroupEmail
      TopicArn: !Ref MonitoringSnsTopic

  FISAlertsEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Notify of FIS experiment status changes
      EventPattern:
        source:
          - aws.fis
        detail:
          experiment-template-id:
            - !Ref DisruptAvailabilityZoneExperiment
      Name: !Sub "${AWS::StackName}-FIS-NetworkDisrupt-Rule"
      State: ENABLED
      Targets:
        - Arn: !Ref MonitoringSnsTopic
          Id: !Sub "${AWS::StackName}-FISNetworkDisrupt-topic"

Outputs:

  FISRoleArn:
    Description: ARN of the FIS IAM role created by this stack.
    Value: !GetAtt NetworkFISExperimentRole.Arn

  ExperimentTemplateId:
    Description: FIS Experiment Template ID
    Value: !Ref DisruptAvailabilityZoneExperiment

  LogGroupName:
    Description: CloudWatch Log Group for FIS experiment logs
    Value: !Ref CloudwatchLogGroup

  SnsTopicArn:
    Description: SNS Topic ARN for FIS notifications
    Value: !Ref MonitoringSnsTopic
